<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LuminaForge — Web design & development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0B15"/>
      <stop offset="1" stop-color="#0B0910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79CFF"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" rx="26" fill="none" stroke="#241E33"/>

  <!-- Monogram -->
  <g transform="translate(90,96)">
    <rect width="96" height="96" rx="22" fill="#14111C" stroke="#241E33"/>
    <path d="M34 26 v34 a6 6 0 0 0 6 6 h22" fill="none" stroke="url(#mark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 24 l4.6 9.4 L74 38 l-9.4 4.2 L60 52 l-4.6-9.8 L46 38 l9.4-4.6 z" fill="#E4C58C"/>
  </g>
  <text x="210" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#F4F2F8" font-weight="600">LuminaForge</text>

  <!-- Headline -->
  <text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#F4F2F8" font-weight="600">Websites that make</text>
  <text x="90" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="600">small businesses look <tspan fill="#A78BFA" font-style="italic">serious.</tspan></text>

  <!-- Subline -->
  <text x="92" y="505" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#A79FB8">Web design &amp; development — Saima · Mardan, KPK</text>

  <!-- Tag chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#CFC9DB">
    <rect x="92" y="540" width="150" height="44" rx="22" fill="#191524" stroke="#241E33"/><text x="118" y="568">Design</text>
    <rect x="256" y="540" width="200" height="44" rx="22" fill="#191524" stroke="#241E33"/><text x="282" y="568">Development</text>
    <rect x="470" y="540" width="150" height="44" rx="22" fill="#191524" stroke="#241E33"/><text x="496" y="568">Branding</text>
  </g>
</svg>
